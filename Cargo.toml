[package]
name = "rurex"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Python bindings to the Rust regex crate"

[lib]
name = "rurex"
crate-type = ["cdylib"]

[dependencies]
pyo3 = "0.30"
regex = "1.13"
regex-syntax = "0.8"

[features]
# Builds the abi3-py310 fallback wheel (ADR-0005); default builds are
# version-specific (non-abi3) for maximum speed.
abi3 = ["pyo3/abi3-py310"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
