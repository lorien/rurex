[package]
name = "rurex"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Python bindings to the Rust regex crate"
# sdist allowlist: maturin honors cargo package semantics for the
# source distribution. Anything NOT listed never ships — new repo
# files are excluded by default and must be added here deliberately
# (verified: untracked files ride along without this).
include = [
    "src/**",
    "tests/**",
    "/LICENSE",
    "/README.md",
]

[lib]
name = "rurex"
crate-type = ["cdylib"]

[dependencies]
pyo3 = "0.30"
regex = "1.13"
regex-automata = { version = "0.4.18", features = ["syntax"] }
regex-syntax = "0.8"
memchr = "2.8"

[features]
# Builds the abi3-py310 fallback wheel (ADR-0005); default builds are
# version-specific (non-abi3) for maximum speed.
abi3 = ["pyo3/abi3-py310"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[dev-dependencies]
pyo3 = { version = "0.30", features = ["auto-initialize"] }
