[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "rurex"
version = "0.1.0"
description = "Python bindings to the Rust regex crate: fast, safe, linear-time regular expressions"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3 :: Only",
]

[tool.maturin]
# Module name defaults to the crate name (`rurex`).
