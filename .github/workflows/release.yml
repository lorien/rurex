name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v7
      - run: uv python install 3.13
      - run: uvx maturin sdist --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  # Native x86_64 wheels: the pypa manylinux_2_28 image sets the glibc
  # floor (RHEL 8+, owner decision). 8 cells: cp310..cp315
  # version-specific, abi3 fallback, cp314t/cp315t free-threaded.
  wheels-x86_64:
    runs-on: ubuntu-latest
    container: quay.io/pypa/manylinux_2_28_x86_64:latest
    strategy:
      fail-fast: false
      matrix:
        py: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15", "3.14t", "3.15t"]
        features: ["", "abi3"]
        exclude:
          - py: "3.10"
            features: "abi3"
          - py: "3.11"
            features: "abi3"
          - py: "3.12"
            features: "abi3"
          - py: "3.13"
            features: "abi3"
          - py: "3.14"
            features: "abi3"
          - py: "3.15"
            features: "abi3"
          - py: "3.14t"
            features: "abi3"
          - py: "3.15t"
            features: "abi3"
    name: wheel ${{ matrix.py }} x86_64${{ matrix.features == 'abi3' && ' (abi3)' || '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: x86_64
      - uses: astral-sh/setup-uv@v7
      - name: Build wheel
        run: |
          uv python install "${{ matrix.py }}"
          PY="$(uv python find '${{ matrix.py }}')"
          if [ -n "${{ matrix.features }}" ]; then
            uvx maturin build --release --interpreter "$PY" --features ${{ matrix.features }} --out dist
          else
            uvx maturin build --release --interpreter "$PY" --out dist
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.py }}-x86_64-${{ matrix.features || 'native' }}
          path: dist/*.whl

  # aarch64 wheels, built natively on GitHub's free arm64 runners:
  # same steps as the x86_64 job. (A cross-compilation variant via
  # the rust-manylinux images was tried first; their container env
  # hijacks the host linker for build scripts. The pypa manylinux_2_28
  # image is not published for arm64, so the glibc floor here comes
  # from the runner's own sysroot - auditwheel tags accordingly and
  # the count check in publish still enforces the full set.)
  wheels-aarch64:
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        py: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15", "3.14t", "3.15t"]
        features: ["", "abi3"]
        exclude:
          - py: "3.10"
            features: "abi3"
          - py: "3.11"
            features: "abi3"
          - py: "3.12"
            features: "abi3"
          - py: "3.13"
            features: "abi3"
          - py: "3.14"
            features: "abi3"
          - py: "3.15"
            features: "abi3"
          - py: "3.14t"
            features: "abi3"
          - py: "3.15t"
            features: "abi3"
    name: wheel ${{ matrix.py }} aarch64${{ matrix.features == 'abi3' && ' (abi3)' || '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: aarch64
      - uses: astral-sh/setup-uv@v7
      - name: Build wheel
        run: |
          uv python install "${{ matrix.py }}"
          PY="$(uv python find '${{ matrix.py }}')"
          if [ -n "${{ matrix.features }}" ]; then
            uvx maturin build --release --interpreter "$PY" --features ${{ matrix.features }} --out dist
          else
            uvx maturin build --release --interpreter "$PY" --out dist
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.py }}-aarch64-${{ matrix.features || 'native' }}
          path: dist/*.whl

  publish:
    # Trusted publishing (OIDC): no PyPI token is stored anywhere.
    # Requires the one-time registration on pypi.org pointing at
    # lorien/rurex + this workflow's "publish" job.
    needs: [sdist, wheels-x86_64, wheels-aarch64]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI trusted publishing
      contents: write # GitHub release assets
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: List artifacts and count check
        run: |
          find dist -type f | sort
          COUNT=$(find dist -type f | wc -l)
          echo "artifacts: $COUNT"
          # 8 + 8 wheels + 1 sdist
          test "$COUNT" -eq 17
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
      - name: Attach to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
