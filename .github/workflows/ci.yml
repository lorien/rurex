name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: cargo test

  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15", "3.14t", "3.15t"]
        free-threaded: [false, true]
        exclude:
          - python-version: "3.10"
            free-threaded: true
          - python-version: "3.11"
            free-threaded: true
          - python-version: "3.12"
            free-threaded: true
          - python-version: "3.13"
            free-threaded: true
          - python-version: "3.14"
            free-threaded: true
          - python-version: "3.15"
            free-threaded: true
          - python-version: "3.14t"
            free-threaded: false
          - python-version: "3.15t"
            free-threaded: false
    name: python (${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # The default key ignores matrix values, so a target/ built
          # against one interpreter (e.g. plain 3.14) was restored into
          # the free-threaded cells - cargo then reused the stale pyo3
          # build config and produced a .so whose init failed with
          # "init function returned uninitialized object" (3.14t only;
          # every cell without a prior matching cache was green).
          key: py-${{ matrix.python-version }}
      - uses: actions/setup-python@v5
        if: ${{ !matrix.free-threaded }}
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v7
        if: ${{ matrix.free-threaded }}
      - name: Set up free-threaded interpreter
        if: ${{ matrix.free-threaded }}
        run: |
          uv python install "${{ matrix.python-version }}"
          # --seed bootstraps pip into the venv (uv venvs ship without
          # it; the shared build step invokes .venv/bin/pip).
          uv venv .venv --seed --python "${{ matrix.python-version }}"
      - name: Build extension and run tests
        run: |
          # Free-threaded cells arrive with .venv already created from
          # the uv-managed t-interpreter.
          if [ ! -x .venv/bin/python ]; then
            python -m venv .venv
          fi
          .venv/bin/pip install --disable-pip-version-check --quiet maturin pytest
          source .venv/bin/activate
          maturin develop
          python -m pytest tests/ -q
      - name: Conformance suite (rust-regex corpus, layers A+B)
        # Layer B compares against stdlib `re` and is triaged on one
        # interpreter version; other cells would churn the ledger for
        # no new information.
        if: ${{ matrix.python-version == '3.13' }}
        run: |
          source .venv/bin/activate
          python -m pytest \
            tests/rustregex/vendored_corpus_engine.py \
            tests/rustregex/vendored_corpus_parity.py -q
