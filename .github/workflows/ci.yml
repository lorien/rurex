name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: cargo test

  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15", "3.14t", "3.15t"]
        free-threaded: [false, true]
        exclude:
          - python-version: "3.10"
            free-threaded: true
          - python-version: "3.11"
            free-threaded: true
          - python-version: "3.12"
            free-threaded: true
          - python-version: "3.13"
            free-threaded: true
          - python-version: "3.14"
            free-threaded: true
          - python-version: "3.15"
            free-threaded: true
          - python-version: "3.14t"
            free-threaded: false
          - python-version: "3.15t"
            free-threaded: false
    name: python (${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        if: ${{ !matrix.free-threaded }}
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v7
        if: ${{ matrix.free-threaded }}
      - name: Set up free-threaded interpreter
        if: ${{ matrix.free-threaded }}
        run: |
          uv python install "${{ matrix.python-version }}"
          # --seed bootstraps pip into the venv (uv venvs ship without
          # it; the shared build step invokes .venv/bin/pip).
          uv venv .venv --seed --python "${{ matrix.python-version }}"
      - name: Build extension and run tests
        run: |
          # Free-threaded cells arrive with .venv already created from
          # the uv-managed t-interpreter.
          if [ ! -x .venv/bin/python ]; then
            python -m venv .venv
          fi
          .venv/bin/pip install --disable-pip-version-check --quiet maturin pytest
          source .venv/bin/activate
          maturin develop
          echo "rustc: $(rustc --version)"
          echo "ext suffix: $(python -c 'import sysconfig; print(sysconfig.get_config_var("EXT_SUFFIX"))')"
          ls .venv/lib/python3.14t/site-packages/rurex/ || true
          python -X gil=1 -c "import rurex; print('import with gil ok:', rurex.__version__)" || true
          python -c "import rurex; print('plain import ok:', rurex.__version__)" || true
          python -m pytest tests/ -q
