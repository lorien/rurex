# TEMPORARY: bisect the 3.14t init failure (SystemError: init
# function returned uninitialized object) across rustc versions on
# the runner. Delete once root-caused.
name: Debug 3.14t
on: workflow_dispatch
jobs:
  bisect:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.97.1", "1.98.0", "1.99.0", "1.99.1"]
    name: rustc ${{ matrix.toolchain }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: astral-sh/setup-uv@v7
      - run: |
          uv python install 3.14t
          uv venv .venv --seed --python 3.14t
          .venv/bin/pip install --disable-pip-version-check --quiet maturin pytest
          source .venv/bin/activate
          rustc --version
          maturin develop
          python -c "import rurex; print('IMPORT OK', rurex.__version__)" || echo "IMPORT FAILED"
          python -m pytest tests/ -q || true
